org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is off until the build is stable; the version probe resolves
# configurations at execution time, which the configuration cache rejects.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# AGP 9 ships its own built-in Kotlin support, and KSP refuses to run alongside it:
#   "KSP is not compatible with Android Gradle Plugin's built-in Kotlin. Please disable by
#    adding android.builtInKotlin=false to gradle.properties and apply kotlin("android") plugin"
# So the built-in is turned off and the standard Kotlin Gradle plugin is applied instead.
# Room's and Hilt's processors both need KSP, so this is not optional.
android.builtInKotlin=false

# AGP 9 also enables a new DSL by default, which the Kotlin Gradle plugin cannot apply against:
#   "The 'org.jetbrains.kotlin.android' plugin is not compatible with AGP's 9.0 new DSL"
# AGP offers exactly two ways out: use AGP's built-in Kotlin (which KSP then refuses), or turn
# the new DSL off. Room and Hilt both need KSP, so the new DSL is off.
#
# THIS IS TEMPORARY AND WILL EXPIRE. `android.newDsl=false` is described by AGP as a way to
# "temporarily bypass this issue", so a future AGP will remove it. When that happens the choice
# is to move to built-in Kotlin and drop KSP, or to stay on an older AGP. Whoever hits it should
# read docs/decisions/0007 before changing anything here.
android.newDsl=false
